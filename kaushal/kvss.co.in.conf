<VirtualHost *:80>
        ServerName kvss.co.in
        ServerAlias www.kvss.co.in
        Redirect permanent / https://kvss.co.in/ 

        RewriteEngine on
        RewriteCond %{SERVER_NAME} =kvss.co.in [OR]
        RewriteCond %{SERVER_NAME} =www.kvss.co.in
        RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>

<VirtualHost *:443>
        ServerAdmin admin@kvss.co.in
        ServerName kvss.co.in
        ServerAlias www.kvss.co.in
        
        DocumentRoot /home/srv/kaushal
        ErrorLog ${APACHE_LOG_DIR}/error.log
        CustomLog ${APACHE_LOG_DIR}/access.log combined

        Alias /static /home/srv/kaushal/kaushal/static
        <Directory /home/srv/kaushal/kaushal/static>
                Require all granted
        </Directory>

        Alias /media /home/srv/kaushal/kaushal/media
        <Directory /home/srv/kaushal/kaushal/media>
                Require all granted
        </Directory>

        <Directory /home/srv/kaushal/kaushal/kaushal>
            <Files wsgi.py>
                    Require all granted
            </Files>
        </Directory>

        WSGIDaemonProcess    kaushal python-path=/home/srv/kaushal/kaushal python-home=/home/srv/kaushal/venv
        WSGIProcessGroup kaushal
        WSGIScriptAlias / /home/srv/kaushal/kaushal/kaushal/wsgi.py


</VirtualHost>

